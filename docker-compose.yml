services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadbox
      POSTGRES_USER: leadbox
      POSTGRES_PASSWORD: leadbox_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadbox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
